version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"

  api-server:
    build: ./server
    container_name: sentinel_backend
    ports:
      - "5000:5000"
    env_file: ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - redis

  worker:
    build: ./server
    container_name: sentinel_worker
    command: node worker.js
    env_file: ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - redis

  frontend:
    build: ./dashboard
    container_name: sentinel_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - api-server